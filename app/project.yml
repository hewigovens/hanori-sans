name: HanoriPreview
options:
  bundleIdPrefix: me.hanori
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  HanoriPreview:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - path: ../dist/HanoriSans-Regular.otf
        buildPhase: resources
      - path: ../dist/HanoriSansFurigana-Regular.otf
        buildPhase: resources
      - path: ../licenses
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.hanori.preview
        INFOPLIST_KEY_CFBundleDisplayName: Hanori Preview
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        TARGETED_DEVICE_FAMILY: "1,2"
  HanoriPreviewTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: HanoriPreview
    settings:
      base:
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/HanoriPreview.app/Contents/MacOS/HanoriPreview"
schemes:
  HanoriPreview:
    build:
      targets:
        HanoriPreview: all
    test:
      targets: [HanoriPreviewTests]
